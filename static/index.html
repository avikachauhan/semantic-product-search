<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Product Search</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--card:#fff;--line:#e7e5e4;--accent:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#171717;--fg:#f5f5f4;--muted:#a8a29e;--card:#232323;--line:#3a3a3a;--accent:#818cf8}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:760px;margin:0 auto;padding:32px 16px}
h1{font-size:1.5rem;margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
#q{flex:1;min-width:200px}button{background:var(--accent);color:#fff;border:0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:12px}.t{font-weight:600}.p{font-weight:600;white-space:nowrap}
.d{color:var(--muted);font-size:.9rem;margin:4px 0 8px}.meta{font-size:.8rem;color:var(--muted)}
mark{background:transparent;color:var(--accent);font-weight:600}.chips{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer}
</style></head>
<body><main>
<h1>Smart Product Search</h1>
<p class="sub">Describe what you need. Try natural language and price limits.</p>
<div class="bar">
  <input id="q" placeholder="e.g. something to keep drinks cold on a hike under $40" autofocus>
  <select id="cat"><option value="">All categories</option></select>
  <button id="go">Search</button>
</div>
<div class="chips" id="chips"></div>
<div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const examples = ["noise cancelling headphones for travel","gift for a toddler","help me sleep better","cheap laptop for students","camping gear under $70"];
examples.forEach(e => { const s = document.createElement("span"); s.textContent = e; s.onclick = () => { $("q").value = e; run(); }; $("chips").appendChild(s); });
fetch("/categories").then(r => r.json()).then(c => c.forEach(x => { const o = document.createElement("option"); o.value = o.textContent = x; $("cat").appendChild(o); }));
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function run() {
  const q = $("q").value.trim(); if (!q) return;
  const params = new URLSearchParams({ q, k: 8 }); if ($("cat").value) params.set("category", $("cat").value);
  const data = await (await fetch("/search?" + params)).json();
  $("out").innerHTML = data.count ? data.results.map(r => `
    <div class="card"><div class="row"><span class="t">${esc(r.title)}</span><span class="p">$${r.price.toFixed(2)}</span></div>
    <div class="d">${esc(r.description)}</div>
    <div class="meta">${esc(r.category)} · ${esc(r.brand)} · ★${r.rating} · relevance ${r.score.toFixed(2)}
    ${r.matched_terms.length ? " · matched: <mark>" + r.matched_terms.map(esc).join(", ") + "</mark>" : ""}</div></div>`).join("")
    : '<p class="sub" style="margin-top:20px">No products match.</p>';
}
$("go").onclick = run; $("q").addEventListener("keydown", e => e.key === "Enter" && run());
</script></body></html>
